<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runtime (Pixi + CommandExecutor)</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1e1e1e; color: #e5e5e5; font-family: -apple-system, system-ui, Segoe UI, Roboto, PingFang SC, Microsoft YaHei, sans-serif; }
    #app { position: relative; width: 800px; height: 600px; margin: 16px auto; border: 1px solid #333; background: #000; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    .choices { position: absolute; left: 100px; top: 270px; display: flex; flex-direction: column; gap: 8px; }
    .choice-btn { padding: 8px 12px; background: #2c3e50; color: #fff; border: none; border-radius: 6px; cursor: pointer; text-align: left; }
  </style>
  <style>
    .topbar { width: 800px; margin: 8px auto 0; display: flex; align-items: center; gap: 8px; }
    .topbar label { font-size: 14px; color: #bbb; }
    .topbar select { background: #2c3e50; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <label for="gamePicker">选择关卡/游戏:</label>
    <select id="gamePicker">
      <option value="adventure">冒险选择游戏</option>
      <option value="memory">翻牌记忆配对</option>
      <option value="select">多选卡片 2×2</option>
    </select>
  </div>
  <div id="app">
    <div id="overlay"></div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const embed = params.get('embed') === '1';
      if (embed) (window as any).__WAIT_FOR_PARENT = true;

      const games = {
        adventure: '/00project/scene/adventure-choice-game-v2.json',
        memory: '/00project/scene/flip-memory-game-v1.json',
        select: '/00project/scene/select-cards-2x2.json'
      };
      const storageKey = 'runtime:selectedGame';
      const saved = localStorage.getItem(storageKey) || 'adventure';
      // Expose for main.js before it loads
      // 资源与关卡统一从 00project 读取
      window.__ASSET_BASE__ = '/00project/';
      window.__GAME_JSON_URL = games[saved] || games.adventure;
      // After DOM is ready, sync selector and bind change
      document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('gamePicker');
        if (sel) {
          sel.value = games[saved] ? saved : 'adventure';
          sel.addEventListener('change', (e) => {
            const v = e.target.value;
            localStorage.setItem(storageKey, v);
            // Simple reload (no query参数), main.js 会按 localStorage 中的选择加载对应 JSON
            location.reload();
          });
        }
      });
      // If embedded, accept game JSON from parent
      window.addEventListener('message', (e) => {
        const msg = e?.data || {};
        if (msg && msg.type === 'LOAD_GAME_JSON') {
          (window as any).__GAME_JSON = msg.payload;
          const boot = (window as any).__BOOTSTRAP_RUNTIME;
          if (typeof boot === 'function') boot();
        }
      });
    })();
  </script>
  <script type="module">
    const PIXI_CDN = [
      'https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js',
      'https://unpkg.com/pixi.js@7/dist/pixi.min.js'
    ];

    async function loadPixi() {
      for (const url of PIXI_CDN) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = url;
            script.onload = () => resolve(null);
            script.onerror = () => reject(new Error('Failed to load ' + url));
            document.head.appendChild(script);
          });
          if (window.PIXI) return;
        } catch (err) {
          console.warn(err);
        }
      }
      throw new Error('Pixi.js CDN 加载失败，请检查网络或提供本地文件');
    }

    await loadPixi();
    await import('./dist/browser/main.js?v=5');
  </script>
</body>
  </html>
