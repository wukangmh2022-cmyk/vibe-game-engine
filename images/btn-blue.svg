<?xml version="1.0" encoding="UTF-8"?>
<!-- Symmetric blue button (no bottom-offset shadow) -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74C0FC"/>
      <stop offset="100%" stop-color="#4DABF7"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="cbg">
      <rect x="6" y="6" width="228" height="52" rx="12" ry="12"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="228" height="52" rx="12" fill="url(#g2)"/>
  <g clip-path="url(#cbg)">
    <rect x="6" y="6" width="228" height="26" rx="12" fill="url(#gl)"/>
  </g>
  <rect x="6" y="6" width="228" height="52" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.6"/>
</svg>
