<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景和光效 -->
  <defs>
    <radialGradient id="treasureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:0.1" />
    </radialGradient>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#696969;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2F4F4F;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 洞穴墙壁 -->
  <rect width="800" height="600" fill="url(#wallGradient)"/>
  
  <!-- 宝藏光芒背景 -->
  <ellipse cx="400" cy="300" rx="300" ry="200" fill="url(#treasureGlow)"/>
  
  <!-- 地面 -->
  <ellipse cx="400" cy="550" rx="350" ry="50" fill="#8B7355" opacity="0.8"/>
  
  <!-- 宝箱 -->
  <g id="treasureChest">
    <!-- 宝箱底部 -->
    <rect x="320" y="350" width="160" height="80" rx="10" fill="#8B4513" stroke="#654321" stroke-width="3"/>
    
    <!-- 宝箱盖子 (打开状态) -->
    <path d="M320,350 Q400,280 480,350" fill="#A0522D" stroke="#654321" stroke-width="3"/>
    
    <!-- 宝箱装饰 -->
    <rect x="330" y="360" width="140" height="5" fill="#FFD700"/>
    <rect x="330" y="380" width="140" height="5" fill="#FFD700"/>
    <rect x="330" y="400" width="140" height="5" fill="#FFD700"/>
    
    <!-- 宝箱锁 -->
    <rect x="390" y="370" width="20" height="15" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
    <circle cx="400" cy="377" r="3" fill="#B8860B"/>
  </g>
  
  <!-- 金币堆 -->
  <g id="goldCoins">
    <!-- 金币散落 -->
    <ellipse cx="350" cy="420" rx="8" ry="3" fill="#FFD700">
      <animate attributeName="ry" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="370" cy="425" rx="8" ry="3" fill="#FFD700">
      <animate attributeName="ry" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="430" cy="425" rx="8" ry="3" fill="#FFD700">
      <animate attributeName="ry" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="420" rx="8" ry="3" fill="#FFD700">
      <animate attributeName="ry" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- 金币堆 -->
    <ellipse cx="380" cy="410" rx="15" ry="8" fill="#FFD700"/>
    <ellipse cx="380" cy="405" rx="12" ry="6" fill="#FFA500"/>
    <ellipse cx="380" cy="400" rx="10" ry="5" fill="#FFD700"/>
    
    <ellipse cx="420" cy="410" rx="15" ry="8" fill="#FFD700"/>
    <ellipse cx="420" cy="405" rx="12" ry="6" fill="#FFA500"/>
    <ellipse cx="420" cy="400" rx="10" ry="5" fill="#FFD700"/>
  </g>
  
  <!-- 传说之剑 -->
  <g id="legendarySword">
    <!-- 剑身 -->
    <rect x="395" y="250" width="10" height="120" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
    
    <!-- 剑刃光芒 -->
    <rect x="397" y="250" width="6" height="120" fill="#E6E6FA" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 护手 -->
    <rect x="380" y="365" width="40" height="8" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
    
    <!-- 剑柄 -->
    <rect x="395" y="373" width="10" height="30" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    
    <!-- 剑柄装饰 -->
    <circle cx="400" cy="380" r="3" fill="#FF0000"/>
    <circle cx="400" cy="390" r="3" fill="#FF0000"/>
    
    <!-- 剑柄末端 -->
    <circle cx="400" cy="408" r="6" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
    
    <!-- 魔法光环 -->
    <circle cx="400" cy="310" r="25" fill="none" stroke="#00FFFF" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="20;30;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 宝石 -->
  <g id="gems">
    <!-- 红宝石 -->
    <polygon points="300,380 310,370 320,380 310,390" fill="#DC143C">
      <animate attributeName="fill" values="#DC143C;#FF69B4;#DC143C" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="310" cy="380" rx="15" ry="10" fill="url(#gemGlow)" opacity="0.3"/>
    
    <!-- 蓝宝石 -->
    <polygon points="480,380 490,370 500,380 490,390" fill="#0000FF">
      <animate attributeName="fill" values="#0000FF;#87CEEB;#0000FF" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="490" cy="380" rx="15" ry="10" fill="#00FFFF" opacity="0.3"/>
    
    <!-- 绿宝石 -->
    <polygon points="340,440 350,430 360,440 350,450" fill="#00FF00">
      <animate attributeName="fill" values="#00FF00;#90EE90;#00FF00" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- 紫宝石 -->
    <polygon points="460,440 470,430 480,440 470,450" fill="#8A2BE2">
      <animate attributeName="fill" values="#8A2BE2;#DDA0DD;#8A2BE2" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- 魔法粒子效果 -->
  <g id="magicParticles">
    <circle cx="200" cy="200" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="cy" values="200;150;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="180" r="2" fill="#00FFFF" opacity="0.8">
      <animate attributeName="cy" values="180;130;180" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="300" r="1.5" fill="#FF69B4" opacity="0.8">
      <animate attributeName="cy" values="300;250;300" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="320" r="1.5" fill="#32CD32" opacity="0.8">
      <animate attributeName="cy" values="320;270;320" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 古老的符文 -->
  <g id="ancientRunes" opacity="0.6">
    <text x="100" y="150" font-family="serif" font-size="20" fill="#8B0000">⚡</text>
    <text x="700" y="170" font-family="serif" font-size="18" fill="#8B0000">◊</text>
    <text x="120" y="450" font-family="serif" font-size="16" fill="#8B0000">※</text>
    <text x="680" y="480" font-family="serif" font-size="22" fill="#8B0000">⚡</text>
  </g>
</svg>