<?xml version="1.0" encoding="UTF-8"?>
<!-- Symmetric orange button (no bottom-offset shadow) -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64">
  <defs>
    <linearGradient id="mainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A56"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="maskRect">
      <rect x="6" y="6" width="228" height="52" rx="12"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="228" height="52" rx="12" fill="url(#mainGrad)"/>
  <g clip-path="url(#maskRect)">
    <rect x="6" y="6" width="228" height="26" rx="12" fill="url(#highlight)"/>
  </g>
  <rect x="6" y="6" width="228" height="52" rx="12" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.3"/>
</svg>
