<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e6eef5"/>
      <stop offset="1" stop-color="#b8c6d4"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c88a2d"/>
      <stop offset="1" stop-color="#996b22"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#373737"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="80" cy="112" rx="36" ry="8" fill="#000" opacity="0.15"/>
  <!-- blade -->
  <path d="M78 16 L108 46 L60 94 L30 64 Z" fill="url(#blade)" stroke="#6d7a86" stroke-width="3"/>
  <!-- fuller (blade groove) -->
  <path d="M74 26 L98 50 L56 92 L50 86 Z" fill="none" stroke="#d5dfe7" stroke-width="2" opacity="0.7"/>
  <!-- guard -->
  <rect x="54" y="86" width="22" height="8" rx="3" ry="3" fill="url(#guard)" stroke="#7a541c" stroke-width="2"/>
  <!-- handle -->
  <rect x="58" y="94" width="14" height="20" rx="3" ry="3" fill="url(#handle)" stroke="#0f0f0f" stroke-width="2"/>
  <!-- pommel -->
  <circle cx="65" cy="116" r="5" fill="#c0c0c0" stroke="#7a7a7a" stroke-width="2"/>
</svg>

