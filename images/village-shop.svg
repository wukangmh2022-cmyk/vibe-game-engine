<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- 地面 -->
  <rect y="400" width="800" height="200" fill="#DEB887"/>
  
  <!-- 商店建筑主体 -->
  <rect x="200" y="250" width="400" height="200" fill="#F5DEB3" stroke="#D2B48C" stroke-width="3"/>
  
  <!-- 屋顶 -->
  <polygon points="150,250 400,150 650,250" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
  
  <!-- 烟囱 -->
  <rect x="500" y="120" width="30" height="80" fill="#8B4513"/>
  <rect x="495" y="115" width="40" height="10" fill="#654321"/>
  
  <!-- 烟雾 -->
  <ellipse cx="515" cy="100" rx="8" ry="12" fill="#D3D3D3" opacity="0.6">
    <animate attributeName="ry" values="12;18;12" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="520" cy="85" rx="6" ry="10" fill="#D3D3D3" opacity="0.4">
    <animate attributeName="ry" values="10;15;10" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 商店门 -->
  <rect x="350" y="350" width="100" height="100" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <circle cx="430" cy="400" r="5" fill="#FFD700"/>
  
  <!-- 窗户 -->
  <rect x="230" y="300" width="80" height="60" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  <line x1="270" y1="300" x2="270" y2="360" stroke="#654321" stroke-width="2"/>
  <line x1="230" y1="330" x2="310" y2="330" stroke="#654321" stroke-width="2"/>
  
  <rect x="490" y="300" width="80" height="60" fill="#87CEEB" stroke="#654321" stroke-width="2"/>
  <line x1="530" y1="300" x2="530" y2="360" stroke="#654321" stroke-width="2"/>
  <line x1="490" y1="330" x2="570" y2="330" stroke="#654321" stroke-width="2"/>
  
  <!-- 商店招牌 -->
  <rect x="250" y="200" width="300" height="40" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-family="serif" font-size="24" fill="#FFD700" font-weight="bold">⚔️ 装备商店 🛡️</text>
  
  <!-- 商店外的装备展示 -->
  <!-- 剑 -->
  <rect x="150" y="380" width="8" height="60" fill="#C0C0C0"/>
  <rect x="145" y="375" width="18" height="10" fill="#8B4513"/>
  <circle cx="154" cy="370" r="5" fill="#FFD700"/>
  
  <!-- 盾牌 -->
  <ellipse cx="680" cy="400" rx="25" ry="35" fill="#8B4513" stroke="#654321" stroke-width="3"/>
  <ellipse cx="680" cy="400" rx="15" ry="25" fill="#C0C0C0"/>
  <circle cx="680" cy="400" r="8" fill="#FFD700"/>
  
  <!-- 药水瓶 -->
  <rect x="120" y="420" width="15" height="25" fill="#FF6347" rx="3"/>
  <rect x="122" y="415" width="11" height="8" fill="#8B4513"/>
  <circle cx="127" cy="430" r="2" fill="#FFD700" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 村民/店主 -->
  <g id="shopkeeper">
    <!-- 身体 -->
    <ellipse cx="400" cy="320" rx="15" ry="25" fill="#8B4513"/>
    <!-- 头 -->
    <circle cx="400" cy="285" r="12" fill="#FDBCB4"/>
    <!-- 帽子 -->
    <ellipse cx="400" cy="280" rx="15" ry="8" fill="#8B4513"/>
    <!-- 眼睛 -->
    <circle cx="395" cy="283" r="1" fill="#000000"/>
    <circle cx="405" cy="283" r="1" fill="#000000"/>
    <!-- 胡子 -->
    <ellipse cx="400" cy="290" rx="8" ry="4" fill="#696969"/>
    <!-- 手臂 -->
    <ellipse cx="385" cy="310" rx="5" ry="15" fill="#FDBCB4" transform="rotate(-20 385 310)"/>
    <ellipse cx="415" cy="310" rx="5" ry="15" fill="#FDBCB4" transform="rotate(20 415 310)"/>
  </g>
  
  <!-- 装饰性元素 -->
  <!-- 花盆 -->
  <rect x="180" y="430" width="20" height="15" fill="#8B4513"/>
  <ellipse cx="190" cy="425" rx="12" ry="8" fill="#32CD32"/>
  <circle cx="185" cy="420" r="2" fill="#FF69B4"/>
  <circle cx="195" cy="422" r="2" fill="#FFFF00"/>
  
  <rect x="600" y="430" width="20" height="15" fill="#8B4513"/>
  <ellipse cx="610" cy="425" rx="12" ry="8" fill="#32CD32"/>
  <circle cx="605" cy="420" r="2" fill="#FF1493"/>
  <circle cx="615" cy="422" r="2" fill="#FFA500"/>
  
  <!-- 云朵 -->
  <ellipse cx="150" cy="80" rx="30" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="170" cy="75" rx="25" ry="15" fill="white" opacity="0.8"/>
  
  <ellipse cx="650" cy="60" rx="35" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="675" cy="55" rx="28" ry="18" fill="white" opacity="0.8"/>
</svg>