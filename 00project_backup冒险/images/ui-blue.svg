<?xml version="1.0" encoding="UTF-8"?>
<!-- Symmetric blue panel v2 with updated colors -->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6CC"/>
      <stop offset="100%" stop-color="#2563EBCC"/>
    </linearGradient>
    <linearGradient id="gloss2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="clip2">
      <rect x="4" y="10" width="552" height="160" rx="22" ry="22"/>
    </clipPath>
  </defs>
  <!-- Fill panel (symmetrical) -->
  <rect x="4" y="10" width="552" height="160" rx="22" ry="22" fill="url(#bg2)"/>
  <!-- Inner highlight -->
  <g clip-path="url(#clip2)">
    <rect x="4" y="10" width="552" height="80" fill="url(#gloss2)"/>
  </g>
  <!-- Border -->
  <rect x="4" y="10" width="552" height="160" rx="22" ry="22" fill="none" stroke="#FFFFFFDD" stroke-width="6"/>
</svg>
