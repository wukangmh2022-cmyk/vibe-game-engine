<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空背景 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空 -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- 地面 -->
  <rect y="400" width="800" height="200" fill="url(#grassGradient)"/>
  
  <!-- 远山 -->
  <polygon points="0,350 150,250 300,300 450,200 600,280 800,220 800,400 0,400" fill="#8FBC8F" opacity="0.7"/>
  
  <!-- 树木 -->
  <!-- 大树1 -->
  <ellipse cx="150" cy="320" rx="60" ry="80" fill="#228B22"/>
  <rect x="140" y="350" width="20" height="50" fill="#8B4513"/>
  
  <!-- 大树2 -->
  <ellipse cx="300" cy="300" rx="70" ry="90" fill="#32CD32"/>
  <rect x="290" y="340" width="20" height="60" fill="#8B4513"/>
  
  <!-- 大树3 -->
  <ellipse cx="500" cy="310" rx="65" ry="85" fill="#228B22"/>
  <rect x="490" y="345" width="20" height="55" fill="#8B4513"/>
  
  <!-- 大树4 -->
  <ellipse cx="650" cy="290" rx="75" ry="95" fill="#32CD32"/>
  <rect x="640" y="335" width="20" height="65" fill="#8B4513"/>
  
  <!-- 小树丛 -->
  <ellipse cx="80" cy="380" rx="30" ry="40" fill="#228B22"/>
  <ellipse cx="120" cy="385" rx="25" ry="35" fill="#32CD32"/>
  <ellipse cx="380" cy="375" rx="35" ry="45" fill="#228B22"/>
  <ellipse cx="720" cy="370" rx="40" ry="50" fill="#32CD32"/>
  
  <!-- 小径 -->
  <ellipse cx="400" cy="500" rx="150" ry="30" fill="#DEB887" opacity="0.8"/>
  <ellipse cx="420" cy="520" rx="120" ry="25" fill="#D2B48C" opacity="0.6"/>
  
  <!-- 花朵装饰 -->
  <circle cx="200" cy="450" r="3" fill="#FF69B4"/>
  <circle cx="205" cy="448" r="3" fill="#FF1493"/>
  <circle cx="195" cy="452" r="3" fill="#FFB6C1"/>
  
  <circle cx="550" cy="460" r="3" fill="#FFFF00"/>
  <circle cx="555" cy="458" r="3" fill="#FFD700"/>
  <circle cx="545" cy="462" r="3" fill="#FFA500"/>
  
  <!-- 云朵 -->
  <ellipse cx="150" cy="100" rx="40" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="170" cy="95" rx="35" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="130" cy="105" rx="30" ry="18" fill="white" opacity="0.8"/>
  
  <ellipse cx="600" cy="80" rx="45" ry="28" fill="white" opacity="0.8"/>
  <ellipse cx="625" cy="75" rx="38" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="575" cy="85" rx="32" ry="20" fill="white" opacity="0.8"/>
</svg>