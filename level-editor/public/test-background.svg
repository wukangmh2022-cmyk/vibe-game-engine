<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空渐变 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- 草地 -->
  <rect y="400" width="800" height="200" fill="url(#grassGradient)"/>
  
  <!-- 云朵 -->
  <g fill="white" opacity="0.8">
    <ellipse cx="150" cy="100" rx="30" ry="20"/>
    <ellipse cx="170" cy="95" rx="25" ry="18"/>
    <ellipse cx="190" cy="100" rx="20" ry="15"/>
    
    <ellipse cx="600" cy="80" rx="35" ry="25"/>
    <ellipse cx="625" cy="75" rx="30" ry="20"/>
    <ellipse cx="650" cy="80" rx="25" ry="18"/>
  </g>
  
  <!-- 太阳 -->
  <circle cx="700" cy="100" r="40" fill="#FFD700" opacity="0.9"/>
  
  <!-- 山脉 -->
  <polygon points="0,400 200,200 400,300 600,150 800,250 800,400" fill="#8FBC8F" opacity="0.7"/>
  
  <!-- 树木 -->
  <g>
    <!-- 树干 -->
    <rect x="100" y="350" width="10" height="50" fill="#8B4513"/>
    <rect x="300" y="340" width="12" height="60" fill="#8B4513"/>
    <rect x="500" y="360" width="8" height="40" fill="#8B4513"/>
    
    <!-- 树叶 -->
    <circle cx="105" cy="340" r="25" fill="#228B22"/>
    <circle cx="306" cy="330" r="30" fill="#32CD32"/>
    <circle cx="504" cy="350" r="20" fill="#228B22"/>
  </g>
  
  <!-- 小花 -->
  <g fill="#FF69B4">
    <circle cx="250" cy="480" r="3"/>
    <circle cx="450" cy="470" r="3"/>
    <circle cx="650" cy="485" r="3"/>
  </g>
</svg>