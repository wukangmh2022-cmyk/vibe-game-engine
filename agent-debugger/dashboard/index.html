<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Agent Queue</title>
  <style>
    :root{--ink:#17212b;--muted:#687582;--line:#d9e0e6;--paper:#f7f9fa;--panel:#fff;--green:#16734f;--blue:#1969a5;--orange:#b55d14;--red:#b33a3a}*{box-sizing:border-box}body{margin:0;min-width:320px;font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--paper)}header{padding:24px max(20px,calc((100vw - 1200px)/2));background:#15232d;color:#fff;display:flex;gap:24px;align-items:end;justify-content:space-between}h1{margin:0;font-size:24px;letter-spacing:0}.sub,.updated{color:#b8c8d4;margin:5px 0 0}.updated{text-align:right;font-variant-numeric:tabular-nums}main{max-width:1200px;margin:0 auto;padding:24px 20px 48px;display:grid;gap:20px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,section{background:var(--panel);border:1px solid var(--line);border-radius:6px}.metric{padding:16px}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;margin-top:8px;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}.queued b{color:var(--blue)}.running b{color:var(--orange)}.done b{color:var(--green)}.failed b{color:var(--red)}section>h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}.workers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}.worker{min-height:175px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fcfdfd;display:flex;flex-direction:column}.worker-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.badge{border-radius:999px;padding:2px 7px;background:#e9f5ee;color:#176342;white-space:nowrap}.badge.working{background:#fff0dc;color:#9e4d09}.person{width:48px;height:48px;position:relative;margin:15px auto 10px}.person:before{content:"";position:absolute;width:18px;height:18px;left:15px;top:0;border-radius:50%;background:#226c89}.person:after{content:"";position:absolute;width:38px;height:27px;left:5px;bottom:0;border-radius:18px 18px 7px 7px;background:#56a0a8}.worker.working .person:after{background:#d88a38}.worker.failed .person:after{background:#bb6060}.bubble{position:relative;margin-top:auto;padding:9px 10px;min-height:48px;background:#eef3f5;border-radius:5px;color:#384854;font-size:12px;overflow-wrap:anywhere}.bubble:before{content:"";position:absolute;top:-6px;left:20px;width:11px;height:11px;background:#eef3f5;transform:rotate(45deg)}.task{margin-top:6px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.events{max-height:430px;overflow:auto}.event{display:grid;grid-template-columns:145px 96px 150px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid #edf0f2;font-size:12px}.event time,.kind,.worker-id{color:var(--muted)}.empty{padding:24px 16px;color:var(--muted)}@media(max-width:800px){header{align-items:start;flex-direction:column}.updated{text-align:left}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.workers{grid-template-columns:repeat(2,minmax(0,1fr))}.event{grid-template-columns:1fr;gap:2px}}@media(max-width:460px){.workers{grid-template-columns:1fr}.metric b{font-size:24px}}
  </style>
</head>
<body>
  <header><div><h1>Command Agent Queue</h1><p class="sub" id="run">正在读取队列状态...</p></div><div class="updated" id="updated">--</div></header>
  <main><div class="metrics" id="metrics"></div><section><h2>Workers</h2><div class="workers" id="workers"></div></section><section><h2>活动记录</h2><div class="events" id="events"></div></section></main>
  <script>
    const stateUrl='../runs/command-agent/task-queue-status.json';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'--';
    function render(d){document.querySelector('#run').textContent=`${d.status==='running'?'运行中':'已结束'} · ${d.run_id||'--'} · 输出 ${d.output||'--'}`;document.querySelector('#updated').textContent=`最后更新 ${fmt(d.updated_at)}`;const labels=[['queued','等待中'],['running','执行中'],['done','已完成'],['failed','待处理']];document.querySelector('#metrics').innerHTML=labels.map(([key,label])=>`<div class="metric ${key}"><span>${label}</span><b>${d.counts?.[key]||0}</b></div>`).join('');const list=Array.from({length:d.workers_configured||0},(_,i)=>`worker-${String(i+1).padStart(2,'0')}`),byId=new Map((d.workers||[]).map(w=>[w.worker_id,w]));document.querySelector('#workers').innerHTML=list.map(id=>{const w=byId.get(id)||{worker_id:id,state:'idle',message:'尚未启动。'},state=esc(w.state);return `<article class="worker ${state}"><div class="worker-head"><strong>${esc(w.worker_id)}</strong><span class="badge ${state}">${w.state==='working'?'工作中':'空闲'}</span></div><div class="person" aria-hidden="true"></div><div class="bubble">${esc(w.message)}</div><div class="task">${esc(w.task_plan_id|| (w.endpoint_slot?`端点 ${w.endpoint_slot}`:''))}</div></article>`}).join('');const events=d.events||[];document.querySelector('#events').innerHTML=events.length?events.map(e=>`<div class="event"><time>${fmt(e.occurred_at)}</time><span class="worker-id">${esc(e.worker_id||'系统')}</span><span class="kind">${esc(e.kind)}</span><span>${esc(e.message)}</span></div>`).join(''):'<div class="empty">暂无活动记录。</div>'}
    async function refresh(){try{const r=await fetch(`${stateUrl}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){document.querySelector('#run').textContent=`无法读取状态文件：${e.message}`}}refresh();setInterval(refresh,1000);
  </script>
</body>
</html>
